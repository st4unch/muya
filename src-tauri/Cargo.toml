[package]
name = "muya"
version = "5.0.7"
description = "Muya — control plane for parallel Claude Code agents"
authors = ["staunch"]
edition = "2021"
# Two [[bin]] targets exist (the app + the muya-ssh-mcp proxy), so `cargo run`
# and `tauri dev` need to know which is the app. Without this they abort with
# "could not determine which binary to run".
default-run = "muya"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "muya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Tauri app binary.
[[bin]]
name = "muya"
path = "src/main.rs"

# Thin stdio MCP proxy Claude Code spawns for the `muya-ssh` server. Builds
# alongside the app; holds NO secrets and does NO ssh — it forwards requests to
# the running app over the owner-only broker UDS (see src/broker.rs).
[[bin]]
name = "muya-ssh-mcp"
path = "src/bin/muya_ssh_mcp.rs"

[features]
# Test-only build for the synthetic-user end-to-end run (local http manifest, test key).
e2e = ["muya-switchover/e2e"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri-free core shared with the native daemons (docs/prd-native-rewrite.md, strangler).
muya-core = { path = "../native/crates/muya-core" }
muya-switchover = { path = "../crates/muya-switchover" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# protocol-asset: serves a runtime-allowlisted local file to the webview as
# asset://<path> (via convertFileSrc) — needed to render images/PDFs without
# reading their bytes through the JS/IPC boundary as text.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.7.1"
sysinfo = "0.38.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "sync", "net", "macros"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# navigator.clipboard.writeText() is unreliable in Tauri's WKWebView (NotAllowedError —
# the web permission model doesn't cleanly apply inside a native webview). This plugin
# talks to the OS clipboard directly and is what every Copy button should use.
tauri-plugin-clipboard-manager = "2"
# Error logging → persistent file (App log dir) + stdout, so issues on another
# machine can be diagnosed from the log.
tauri-plugin-log = "2"
log = "0.4"
# Schedules: local wall-clock next-run math (daily / weekly, DST-aware).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Faz 3: sandbox TempDir for task execution cwd isolation
tempfile = "3.27.0"
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
# SSH agent broker: getpeereid(2) peer-uid check on the owner-only broker socket.
libc = "0.2"

[dev-dependencies]
# MockRuntime for the window-close test (lib.rs window_close_tests).
tauri = { version = "2", features = ["test", "protocol-asset", "tray-icon", "image-png"] }
tempfile = "3.27.0"
wiremock = "0.6"
sha2 = "0.11.0"


# Smaller, faster release binary. No `panic = "abort"`: a panic on a side thread
# (a PTY reader, the watcher) must not take every open terminal down with it.
[profile.release]
lto = true
codegen-units = 1
strip = true
