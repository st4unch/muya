# Native Muya (PRD docs/prd-native-rewrite.md): daemons, protocol and the Tauri-free core.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
# Function names stay for crash reports; DWARF would embed build paths.
strip = "debuginfo"
