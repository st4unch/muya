# Test helper, not shipped: classic Muya's ORIGINAL password-store code (the src-tauri/src/credstore.rs from before it
# moved into muya-core, commit b703a25^) built as a tiny CLI, so Native's vault can be tested against the code that
# really wrote classic users' files. src/old_credstore.rs is generated by scripts/test-classic-vault.sh (not committed).
[package]
name = "classic-vault"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
rand = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
