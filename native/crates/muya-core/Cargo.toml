[package]
name = "muya-core"
description = "Tauri-free Muya logic shared by the Tauri app (strangler) and muyad (PRD AC1)"
edition = "2021"
version.workspace = true
license.workspace = true

[dependencies]
tempfile = "3"
libc = "0.2"
portable-pty = "0.9.0"
dirs-next = "2"
core-foundation = "0.10"
sha2 = "0.11.0"
aes-gcm = "0.10"
argon2 = "0.5"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
notify = "8.2.0"
scraper = "0.19"
objc2-service-management = "0.3.2"
objc2 = "0.6"
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
rand = "0.9"
regex = "1.12"
log = "0.4"
sysinfo = "0.38.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "sync", "net", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
# Bridge (moved from src-tauri): remote mTLS + SPAKE2 pairing — same versions as before.
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = { version = "0.14.8", features = ["pem"] }
spake2-conflux = { version = "0.6.0", features = ["std"] }
hkdf = "0.13.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError"] }


[dev-dependencies]
wiremock = "0.6"
serde_json = "1.0.150"
tempfile = "3"
